<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<title>KET 背单词</title>
<link rel="manifest" href="manifest.webmanifest">
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#f3f4fb; --card:#ffffff; --ink:#1f2340; --sub:#6b7194;
  --brand:#5b6cff; --brand2:#8a6cff; --good:#22b573; --bad:#ff5d6c;
  --warn:#ffb020; --line:#e7e8f2; --shadow:0 8px 24px rgba(40,44,90,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-top:env(safe-area-inset-top);}
.hidden{display:none!important}
header{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.5px}
header h1 span{color:var(--brand)}
.streak{background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);color:var(--warn)}
main{flex:1;overflow-y:auto;padding:4px 16px 92px;-webkit-overflow-scrolling:touch}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:16px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.plan-hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 30px rgba(91,108,255,.35);margin-bottom:16px}
.plan-hero .date{opacity:.85;font-size:13px;font-weight:600}
.scope-pill{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;margin-top:8px}
.plan-nums{display:flex;gap:14px;margin:14px 0 4px}
.plan-nums .n{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:12px;text-align:center}
.plan-nums .n b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.plan-nums .n small{opacity:.9;font-size:12px}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:#fff;color:var(--brand)}
.btn-solid{background:var(--brand);color:#fff}
.btn-ghost{background:var(--bg);color:var(--ink);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:11px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
input[type=range]{width:150px;accent-color:var(--brand)}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px}
.cat-chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer}
.cat-chip.on{border-color:var(--brand);background:#eef0ff;color:var(--brand)}
.cat-chip small{color:var(--sub);font-weight:600;font-size:11px}
.cat-chip.on small{color:var(--brand)}
.study-wrap{display:flex;flex-direction:column;height:100%}
.progressbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
.phase-tag{text-align:center;font-size:12px;font-weight:800;color:var(--brand);margin-bottom:6px;letter-spacing:1px}
.flashcard{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:30px 22px;text-align:center;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.pos-tag{display:inline-block;background:#eef0ff;color:var(--brand);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.tier-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.tier-core{background:#fff1e8;color:#e8862e}
.tier-recog{background:#eafaf1;color:var(--good)}
.cat-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#f3e8ff;color:#8a4bd6}
.word-big{font-size:42px;font-weight:800;letter-spacing:.5px;word-break:break-word}
.cn-big{font-size:24px;font-weight:700}
.audio-btn{width:56px;height:56px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 16px rgba(91,108,255,.4)}
.audio-btn:active{transform:scale(.92)}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid var(--line);background:#fff;border-radius:14px;margin-bottom:10px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--good);background:#eafaf1;color:var(--good)}
.opt.wrong{border-color:var(--bad);background:#ffeef0;color:var(--bad)}
.qword{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.qcn{font-size:26px;font-weight:800;text-align:center;margin:6px 0}
.spell-input{width:100%;font-size:26px;text-align:center;padding:14px;border:2px solid var(--line);border-radius:14px;font-weight:700;letter-spacing:3px;outline:none}
.spell-input:focus{border-color:var(--brand)}
.hint-slots{text-align:center;font-size:30px;font-weight:800;letter-spacing:6px;margin:10px 0;color:var(--brand)}
.letter-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.letter-bank button{width:46px;height:46px;border-radius:12px;border:none;background:var(--brand);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.letter-bank button:disabled{opacity:.3}
.feedback{text-align:center;font-size:16px;font-weight:800;margin:12px 0;min-height:22px}
.feedback.ok{color:var(--good)}
.feedback.no{color:var(--bad)}
.scorebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--sub)}
.combo{color:var(--warn)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-cell{padding:16px 8px;border-radius:14px;background:#fff;box-shadow:var(--shadow);text-align:center;font-weight:700;font-size:15px;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:center;transition:.15s;border:2px solid transparent}
.match-cell.sel{border-color:var(--brand);background:#eef0ff}
.match-cell.gone{opacity:0;pointer-events:none;transform:scale(.6)}
.match-cell.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex-menu-item{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:transform .1s}
.ex-menu-item:active{transform:scale(.98)}
.ex-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ex-menu-item h3{margin:0 0 3px;font-size:15px}
.ex-menu-item p{margin:0;font-size:12px;color:var(--sub)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.stat-box b{display:block;font-size:30px;font-weight:800;color:var(--brand)}
.stat-box small{color:var(--sub);font-size:12px}
.pbar{height:10px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;border-radius:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(40,44,90,.05)}
nav button{flex:1;border:none;background:transparent;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:11px;font-weight:600;cursor:pointer}
nav button .ico{font-size:20px}
nav button.on{color:var(--brand)}
.done-card{text-align:center;padding:30px}
.done-card .big{font-size:56px}
.select-wrap select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font-size:15px;font-weight:700;color:var(--ink);background:#fff}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.search-box{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font-size:15px;outline:none;margin-bottom:12px}
.search-box:focus{border-color:var(--brand)}
.wl-cat{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer;font-weight:700;font-size:14px}
.wl-cat small{color:var(--sub);font-weight:600;font-size:12px}
.wl-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.wl-row:first-child{border-radius:14px 14px 0 0}
.wl-row:last-child{border-radius:0 0 14px 14px;border-bottom:none}
.wl-play{width:34px;height:34px;border-radius:50%;border:none;background:#eef0ff;color:var(--brand);font-size:15px;flex-shrink:0;cursor:pointer}
.wl-w{font-weight:800;font-size:15px}
.wl-p{font-size:11px;color:var(--sub);font-weight:600}
.wl-cn{font-size:13px;color:var(--sub);margin-top:1px}
.wl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.wl-dot.on{background:var(--good)}
.wl-dot.off{background:var(--line)}
.wl-list{margin-bottom:12px}
.modal-overlay{position:absolute;inset:0;background:rgba(20,22,45,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:340px;max-height:80vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:16px}
.modal textarea{width:100%;height:120px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:12px;font-family:monospace;resize:none}
.mini-btn{display:inline-block;border:none;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--brand);color:#fff}
.mini-btn.ghost{background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header>
  <h1>KET <span>背单词</span></h1>
  <div class="streak" id="streak">🔥 0 天</div>
</header>
<main id="main"></main>
<nav>
  <button data-view="plan" class="on"><span class="ico">📅</span>计划</button>
  <button data-view="study"><span class="ico">📖</span>学习</button>
  <button data-view="exercise"><span class="ico">🎮</span>练习</button>
  <button data-view="dict"><span class="ico">📚</span>词表</button>
  <button data-view="stats"><span class="ico">📊</span>统计</button>
</nav>

<script src="vocab.js"></script>
<script src="categories.js"></script>
<script src="irregulars.js"></script>
<script>
/* ============ 数据与存储 ============ */
const VOCAB=window.KET_VOCAB||[];
VOCAB.forEach((v,i)=>v.id=i);
const NOUN_MAP=window.KET_NOUN_MAP||{};
const VERB_MAP=window.KET_VERB_MAP||{};
const ADJ_MAP=window.KET_ADJ_MAP||{};
const IRR=window.KET_IRREGULARS||[];
const CAT_META=window.KET_CAT_META||[];
const LS='ket_bdc_v2';
const DAY=86400000;
const INTERVALS=[0,1,2,4,7,15,30,60];

function defaultState(){return {progress:{},settings:{pool:'both',dailyNew:15,category:'全部',sessionLen:'std',exCat:'全部',syncCode:''},streak:0,lastDay:null,studiedDays:[],irr:{},history:[],session:null,updatedAt:0};}
let state=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS));if(s){const d=defaultState();return Object.assign(d,s,{settings:Object.assign(d.settings,s.settings||{})});}}catch(e){}
  return defaultState();
}
let applyingRemote=false,pushTimer=null;
function save(){
  if(!applyingRemote)state.updatedAt=Date.now();
  localStorage.setItem(LS,JSON.stringify(state));
  if(!applyingRemote)schedulePush();
}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function now(){return Date.now();}
function markStudied(){
  const t=todayKey();if(state.lastDay===t)return;
  const y=new Date(now()-DAY);const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  state.streak=(state.lastDay===yk)?state.streak+1:1;state.lastDay=t;
  if(!state.studiedDays.includes(t))state.studiedDays.push(t);save();
}
/* 分类 */
function catOf(v){
  const p=v.p;
  if(p==='n')return NOUN_MAP[v.w]||'其他名词';
  if(p==='v'||p==='phr'){return NOUN_MAP[v.w]||VERB_MAP[v.w]||'动词·其他';}
  if(p==='adj')return ADJ_MAP[v.w]||'形容词·其他';
  return '功能词与其他';
}
function catMeta(name){return CAT_META.find(c=>c.name===name)||{name:name,icon:'📦'};}
function activeCats(){
  const set={};VOCAB.forEach(v=>set[catOf(v)]=(set[catOf(v)]||0)+1);
  return CAT_META.filter(c=>set[c.name]).map(c=>c.name);
}
/* 词池 */
function poolTier(){
  const p=state.settings.pool;
  if(p==='core')return VOCAB.filter(v=>v.c===1);
  if(p==='recognize')return VOCAB.filter(v=>v.c===0);
  return VOCAB;
}
function scopePool(){
  const cat=state.settings.category;
  let arr=poolTier();
  if(cat&&cat!=='全部')arr=arr.filter(v=>catOf(v)===cat);
  return arr;
}
function prog(id){return state.progress[id]||null;}
function dueReviews(scoped){
  let arr=poolTier().filter(v=>{const p=prog(v.id);return p&&p.box>0&&p.due<=now();});
  const cat=state.settings.category;
  if(scoped&&cat&&cat!=='全部')arr=arr.filter(v=>catOf(v)===cat);
  return arr;
}
function newWords(limit){return scopePool().filter(v=>!prog(v.id)).slice(0,limit);}
function grade(id,ok){
  let p=prog(id)||{box:0,seen:0,ok:0,no:0};
  p.seen++;
  if(ok){p.ok++;p.box=Math.min(p.box+1,INTERVALS.length-1);}
  else{p.no++;p.box=1;}
  p.due=now()+INTERVALS[p.box]*DAY;
  state.progress[id]=p;save();
}
/* ============ 通用 ============ */
const main=document.getElementById('main');
function updStreak(){document.getElementById('streak').textContent='🔥 '+state.streak+' 天';}
updStreak();
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1500);}
function esc(s){return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jss(s){return (s+'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniq(a){return Array.from(new Set(a));}
/* 发音 */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices();}catch(e){}}
loadVoices();if('speechSynthesis' in window && speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
function speak(text){
  const clean=(text+'').replace(/\/.*/,'').replace(/\(.*\)/,'').trim();
  if(window.AndroidTTS&&typeof window.AndroidTTS.speak==='function'){try{window.AndroidTTS.speak(clean);return;}catch(e){}}
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);u.lang='en-GB';u.rate=.85;
  const v=voices.find(v=>/en-GB/i.test(v.lang))||voices.find(v=>/en/i.test(v.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
/* 干扰项(优先同类别，做“相近释义”) */
function distractors(v,n){
  let sib=scopeAll().filter(x=>x.id!==v.id&&catOf(x)===catOf(v));
  let src=sib.length>=n?sib:poolTier().filter(x=>x.id!==v.id);
  if(src.length<n)src=VOCAB.filter(x=>x.id!==v.id);
  return shuffle(src).slice(0,n);
}
function scopeAll(){return poolTier();}
/* 导航 */
document.querySelectorAll('nav button').forEach(b=>{b.onclick=()=>go(b.dataset.view);});
/* 全局回车：进入下一题/下一词 */
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&typeof ENTER==='function'){e.preventDefault();ENTER();}});
function go(view){
  ENTER=null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  if(view==='plan')renderPlan();
  else if(view==='study')studyStart();
  else if(view==='exercise')renderExerciseMenu();
  else if(view==='dict')renderDict();
  else if(view==='stats')renderStats();
}
/* ============ 计划页 ============ */
function catCounts(){
  const m={};VOCAB.forEach(v=>{const c=catOf(v);if(!m[c])m[c]={t:0,s:0};m[c].t++;if(prog(v.id))m[c].s++;});
  return m;
}
function renderPlan(){
  const s=state.settings;
  const nw=newWords(s.dailyNew).length,rv=dueReviews(true).length;
  const d=new Date();const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const cc=catCounts();
  const chips=['全部'].concat(activeCats()).map(name=>{
    const on=s.category===name;
    if(name==='全部'){const tot=poolTier().length,seen=poolTier().filter(v=>prog(v.id)).length;
      return `<div class="cat-chip ${on?'on':''}" onclick="pickCat('全部')">🌟 全部 <small>${seen}/${tot}</small></div>`;}
    const c=cc[name]||{t:0,s:0};
    return `<div class="cat-chip ${on?'on':''}" onclick="pickCat('${jss(name)}')">${catMeta(name).icon} ${esc(name)} <small>${c.s}/${c.t}</small></div>`;
  }).join('');
  main.innerHTML=`
  <div class="view">
    <div class="plan-hero">
      <div class="date">${d.getMonth()+1}月${d.getDate()}日 · ${wd}</div>
      <div style="font-size:20px;font-weight:800;margin-top:2px">今日学习计划</div>
      <div class="scope-pill">${s.category==='全部'?'🌟 全部词库':catMeta(s.category).icon+' '+esc(s.category)}</div>
      <div class="plan-nums">
        <div class="n"><b>${nw}</b><small>新词(先学后测)</small></div>
        <div class="n"><b>${rv}</b><small>待复习</small></div>
      </div>
      <button class="btn btn-primary" onclick="go('study')">${nw+rv>0?'开始学习 →':'该范围已学完 ✓'}</button>
    </div>
    <div class="card">
      <h2>🗂️ 按类别学习</h2>
      <div class="cat-grid">${chips}</div>
      <p class="muted" style="margin-top:12px">选一个类别（如动物、职业、动词），就只学练该类单词。默认「全部」综合学习。</p>
    </div>
    <div class="card">
      <h2>📚 词库分级</h2>
      <div class="seg" id="poolSeg">
        <button data-p="core">核心(需拼写)</button>
        <button data-p="recognize">普通(认读)</button>
        <button data-p="both">全部</button>
      </div>
    </div>
    <div class="card">
      <h2>⚙️ 每日新词量</h2>
      <div class="row"><span>每天学习新词</span>
        <span><input type="range" id="dnRange" min="5" max="40" step="5" value="${s.dailyNew}"> <b id="dnVal">${s.dailyNew}</b></span></div>
      <p class="muted">复习按记忆曲线自动安排：答对的词 1→2→4→7→15→30→60 天逐步拉长间隔，答错重来。</p>
    </div>
  </div>`;
  document.querySelectorAll('#poolSeg button').forEach(b=>{
    b.classList.toggle('on',b.dataset.p===s.pool);
    b.onclick=()=>{state.settings.pool=b.dataset.p;save();renderPlan();};
  });
  const r=document.getElementById('dnRange');

function resumeSession(){const s=state.session;if(!s)return renderExerciseMenu();PS={kind:s.kind,game:s.game,cat:s.cat,queue:s.q,idx:s.idx,correct:s.correct,combo:s.combo,best:s.best,wrong:s.wrong,ts:s.ts};MODE='practice';qsNext();}

function qsHeader(){

function qsNext(){

/* 配对消除（成组，记录历史） */
function startMatch(){
  let src=learnedInScope(practiceCat());if(src.length<4)src=(practiceCat()==='全部'?scopePool():scopePool().filter(v=>catOf(v)===practiceCat()));
  src=uniqBy(src);if(src.length<4)return practiceEmpty();
  const t=Math.min(sessN(),src.length);
  MG={words:shuffle(src).slice(0,t),pos:0,correct:0,combo:0,best:0,wrong:[],ts:now()};
  MG.ids=MG.words.map(v=>v.id);MODE='match';matchBoard();
}
function matchBoard(){
  if(MG.pos>=MG.words.length)return matchFinish();
  ENTER=null;
  const batch=MG.words.slice(MG.pos,MG.pos+5);
  const left=shuffle(batch.map(v=>({k:v.id,t:v.w,ty:'w'})));
  const right=shuffle(batch.map(v=>({k:v.id,t:v.cn,ty:'c'})));
  matchCtx={n:batch.length,done:0,sel:null};
  const cell=o=>`<div class="match-cell" data-k="${o.k}" data-ty="${o.ty}" onclick="matchTap(this)">${esc(o.t)}</div>`;
  main.innerHTML=`<div class="view">
    <div class="scorebar"><span>${Math.min(MG.pos+batch.length,MG.words.length)}/${MG.words.length} · 对 ${MG.correct}</span><span class="combo">🔥 ${MG.combo}</span></div>
    <div class="progressbar"><i style="width:${(MG.pos/MG.words.length*100).toFixed(0)}%"></i></div>
    <div style="text-align:right;margin:-2px 0 6px"><button class="mini-btn ghost" onclick="go('exercise')">退出</button></div>
    <div class="card"><p class="muted" style="text-align:center;margin-bottom:12px">点单词，再点对应中文</p>
      <div class="match-grid"><div>${left.map(cell).join('')}</div><div>${right.map(cell).join('')}</div></div>
      <div id="cont"></div></div></div>`;
}
function matchTap(el){
  if(el.classList.contains('gone'))return;
  const sel=matchCtx.sel;
  if(!sel){matchCtx.sel=el;el.classList.add('sel');if(el.dataset.ty==='w')speak(VOCAB[+el.dataset.k].w);return;}
  if(sel===el){el.classList.remove('sel');matchCtx.sel=null;return;}
  if(sel.dataset.ty===el.dataset.ty){sel.classList.remove('sel');matchCtx.sel=el;el.classList.add('sel');if(el.dataset.ty==='w')speak(VOCAB[+el.dataset.k].w);return;}
  if(sel.dataset.k===el.dataset.k){
    sel.classList.add('gone');el.classList.add('gone');
    grade(+el.dataset.k,true);MG.correct++;MG.combo++;if(MG.combo>MG.best)MG.best=MG.combo;
    matchCtx.done++;matchCtx.sel=null;
    if(matchCtx.done===matchCtx.n){MG.pos+=matchCtx.n;document.getElementById('cont').innerHTML=`<div class="feedback ok">这组完成！ 🎉</div><button class="btn btn-solid" onclick="matchBoard()">${MG.pos<MG.words.length?'下一组 →':'完成 ✓'}</button>`;ENTER=matchBoard;}
  }else{
    grade(+sel.dataset.k,false);MG.combo=0;if(MG.wrong.indexOf(+sel.dataset.k)<0)MG.wrong.push(+sel.dataset.k);
    const s=sel;el.classList.add('err');s.classList.add('err');
    setTimeout(()=>{el.classList.remove('err','sel');s.classList.remove('err','sel');},350);
    matchCtx.sel=null;
  }
}
function matchFinish(){
  markStudied();updStreak();ENTER=null;
  const rec={ts:MG.ts,kind:'match',total:MG.words.length,correct:MG.correct,wrong:MG.wrong.slice(),ids:MG.ids};
  state.history=state.history||[];state.history.unshift(rec);if(state.history.length>40)state.history.length=40;save();
  main.innerHTML=`<div class="view"><div class="card done-card"><div class="big">🧩</div><h2>配对完成！</h2><p class="muted">${MG.words.length} 词 · 最佳连击 🔥${MG.best}</p><button class="btn btn-solid" style="margin-top:14px" onclick="startMatch()">再来一组</button><button class="btn btn-ghost" style="margin-top:10px" onclick="go('exercise')">返回</button></div></div>`;
}

let dict={q:'',filter:'all',open:{}};
function catWords(name){return VOCAB.filter(v=>catOf(v)===name);}
function dictFilter(words){if(dict.filter==='learned')return words.filter(v=>prog(v.id));if(dict.filter==='new')return words.filter(v=>!prog(v.id));return words;}
function toggleCat(name){dict.open[name]=!dict.open[name];renderDict();}
function wlRow(v){const seen=prog(v.id);
  return `<div class="wl-row">
    <button class="wl-play" onclick="speak('${jss(v.w)}')">🔊</button>
    <div style="flex:1;min-width:0"><span class="wl-w">${esc(v.w)}</span> <span class="wl-p">${v.p}${v.c===1?' · 需拼写':' · 认读'}</span><div class="wl-cn">${esc(v.cn)} · ${esc(catOf(v))}</div></div>
    <span class="wl-dot ${seen?'on':'off'}" title="${seen?'已学':'未学'}"></span>

function renderDict(){
  const tot=VOCAB.length,learned=Object.keys(state.progress).length;
  const q=dict.q.trim().toLowerCase();
  let body='';
  if(q){
    let res=VOCAB.filter(v=>v.w.toLowerCase().includes(q)||(''+v.cn).includes(dict.q.trim()));

    body=`<div class="muted" style="margin-bottom:8px">找到 ${res.length} 个结果${res.length>150?'（仅显示前150）':''}</div>
      <div class="wl-list">${res.length?res.slice(0,150).map(wlRow).join(''):'<div class="muted" style="padding:10px">没有匹配的单词</div>'}</div>`;
  }else{
    body=activeCats().map(name=>{
      const words=catWords(name);const seen=words.filter(v=>prog(v.id)).length;const open=dict.open[name];
      const fl=dictFilter(words);
      return `<div class="wl-cat" onclick="toggleCat('${jss(name)}')"><span>${catMeta(name).icon} ${esc(name)}</span><small>${seen}/${words.length} ${open?'▲':'▼'}</small></div>`+
        (open?`<div class="wl-list">${fl.length?fl.map(wlRow).join(''):'<div class="muted" style="padding:10px">该筛选下暂无单词</div>'}</div>`:'');
    }).join('');

    <input class="search-box" id="dsearch" placeholder="🔍 搜索单词或中文…" value="${esc(dict.q)}">

      <button data-f="learned">已学 ${learned}</button>
      <button data-f="new">未学 ${tot-learned}</button>
    </div>${body}</div>`;
  const si=document.getElementById('dsearch');
  si.oninput=()=>{const pos=si.selectionStart;dict.q=si.value;renderDict();const n=document.getElementById('dsearch');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  document.querySelectorAll('#dfilter button').forEach(b=>{b.classList.toggle('on',b.dataset.f===dict.filter);b.onclick=()=>{dict.filter=b.dataset.f;renderDict();};});
}

function downloadData(){
  const content=JSON.stringify(state);const name='ket背单词-学习记录-'+todayKey()+'.json';
  if(window.AndroidTTS&&typeof window.AndroidTTS.saveFile==='function'){try{const r=window.AndroidTTS.saveFile(name,content);toast(r||'已保存到手机「下载」文件夹');return;}catch(e){}}
  try{const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已下载');}catch(e){toast('下载失败，请改用复制');}}
function copyData(){const ta=document.getElementById('expTa');if(!ta)return;ta.select();try{document.execCommand('copy');toast('已复制到剪贴板');}catch(e){toast('请长按文本手动复制');}}
function importData(){
  showModal(`<h3>📥 导入学习记录</h3><p class="muted">选择之前导出的 .json 文件，或粘贴备份文本，然后加载。</p>
    <input type="file" id="impFile" accept=".json,application/json,text/plain" style="margin-bottom:10px">
    <textarea id="impTa" placeholder="或在此粘贴导出的文本…"></textarea>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="mini-btn" onclick="doImport()">加载</button>
      <button class="mini-btn ghost" onclick="closeModal()">取消</button></div>`);
  const f=document.getElementById('impFile');
  f.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{document.getElementById('impTa').value=r.result;};r.readAsText(file);};
}
function doImport(){
  const txt=(document.getElementById('impTa').value||'').trim();if(!txt){toast('请选择文件或粘贴内容');return;}
  try{const obj=JSON.parse(txt);if(!obj||typeof obj!=='object'||!('progress' in obj))throw 0;
    const d=defaultState();state=Object.assign(d,obj,{settings:Object.assign(d.settings,obj.settings||{})});
    state.updatedAt=Date.now();save();updStreak();closeModal();toast('学习记录已加载 ✓');renderStats();
  }catch(e){toast('文件格式不正确，无法加载');}
}
/* ============ 云同步 (Firebase, 可选) ============ */
let db=null;
function syncConfigured(){return !!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.FIREBASE_CONFIG.projectId);}
function syncCode(){return ((state.settings.syncCode||'')+'').trim();}
function syncEnabled(){return !!(db&&syncCode());}
function syncInit(){
  try{
    if(!syncConfigured()||typeof firebase==='undefined')return;
    if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
    db=firebase.firestore();
    if(syncCode())syncPull(true);
  }catch(e){/* 离线或配置有误则退回本地 */}
}
function syncDocRef(){return db.collection('ket_families').doc(syncCode());}
function syncStatus(msg){const el=document.getElementById('syncStatus');if(el)el.textContent=msg;}
function schedulePush(){if(!syncEnabled())return;clearTimeout(pushTimer);pushTimer=setTimeout(syncPush,1500);}
function syncPush(){
  if(!syncEnabled())return;
  syncStatus('正在上传…');
  syncDocRef().set({data:JSON.stringify(state),updatedAt:state.updatedAt||Date.now(),ts:Date.now()})
    .then(()=>syncStatus('已上传到云端 ✓ '+new Date().toLocaleTimeString('zh-CN')))
    .catch(e=>syncStatus('上传失败：'+((e&&e.code)||'检查网络')));
}
function syncPull(pushIfNewer){
  if(!syncEnabled())return;
  syncStatus('正在从云端同步…');
  syncDocRef().get().then(doc=>{
    if(doc.exists){
      const d=doc.data();const remoteAt=d.updatedAt||0;
      if(remoteAt>(state.updatedAt||0)){
        try{const obj=JSON.parse(d.data);applyingRemote=true;
          const dd=defaultState();state=Object.assign(dd,obj,{settings:Object.assign(dd.settings,obj.settings||{})});
          localStorage.setItem(LS,JSON.stringify(state));applyingRemote=false;
          updStreak();syncStatus('已从云端更新 ✓');refreshView();
        }catch(e){applyingRemote=false;syncStatus('云端数据无法解析');}
      }else{if(pushIfNewer)syncPush();else syncStatus('本地已是最新 ✓');}
    }else{syncPush();syncStatus('已在云端创建记录 ✓');}
  }).catch(e=>syncStatus('同步失败：'+((e&&e.code)||'检查网络')));
}
function refreshView(){const on=document.querySelector('nav button.on');const v=on?on.dataset.view:'plan';if(v==='plan'||v==='stats'||v==='dict')go(v);}
function saveSyncCode(){
  const inp=document.getElementById('syncCodeIn');if(!inp)return;
  const v=inp.value.trim();state.settings.syncCode=v;save();
  if(v){if(!db)syncInit();else syncPull(true);toast('同步码已保存，开始同步');}
  else toast('已清空同步码（停用同步）');
}
function syncPanel(){
  if(!syncConfigured())
    return `<p class="muted">尚未配置云同步。按《托管与云同步指南.md》里的步骤，把 Firebase 配置填入 <b>firebase-config.js</b> 后，这里就能设置同步码，实现安卓 ↔ iPad 自动同步。</p>`;
  return `<p class="muted">安卓和 iPad 填<b>相同</b>的同步码即可自动同步（每次学习自动上传，打开自动下载，谁最后学以谁为准）。</p>
    <input class="search-box" id="syncCodeIn" placeholder="设置家庭同步码，如 fishdragon-ket-2026" value="${esc(syncCode())}">
    <div id="syncStatus" class="muted" style="margin:2px 0 10px;min-height:16px"></div>
    <button class="btn btn-solid" onclick="saveSyncCode()">保存并开启自动同步</button>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="mini-btn ghost" style="flex:1" onclick="syncPull(false)">⬇ 立即下载</button>
      <button class="mini-btn" style="flex:1" onclick="syncPush()">⬆ 立即上传</button>
    </div>`;
}
/* ============ 启动 ============ */
if(VOCAB.length===0){main.innerHTML='<div class="done-card">词库加载失败，请确认 vocab.js、categories.js 与本文件在同一目录。</div>';}
else{renderPlan();}
if(document.readyState==='complete')syncInit();else window.addEventListener('load',syncInit);
</script>
